name: Run recurring bills sweep

# 定时账单的真实定时任务：没有常驻服务器，靠 GitHub Actions 每天临时起一台机器，
# 跑一次 server/src/runOnce.js（扫全部用户到期的定时账单、生成交易记录），跑完就销毁。
#
# 使用前需要在仓库 Settings -> Secrets and variables -> Actions 里配置两个 secret：
#   - SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY（在 Supabase 后台 Project Settings -> API 里找，权限很高，
#     只能存成 secret，绝对不能写进代码或提交进仓库）
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run sweep
        working-directory: server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
